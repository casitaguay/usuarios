# Textos del core (emails). Un proyecto derivado los sustituye repitiendo la clave en su
# messages.properties (research R18).

email.saludo=Hola, {0}:
email.pie=Este es un mensaje automático; no respondas a este email.

email.verificacion.asunto=Verifica tu email
email.verificacion.cuerpo=Para activar tu cuenta, abre este enlace:
email.verificacion.validez=El enlace es válido durante {0} horas y solo se puede usar una vez.
email.verificacion.no-fuiste=Si no te has registrado, ignora este email.

email.registro-existente.asunto=Intento de registro con tu email
email.registro-existente.cuerpo=Alguien ha intentado crear una cuenta con tu email, pero ya tienes una.
email.registro-existente.recuperar=Si has olvidado tu contraseña, puedes recuperarla aquí:
email.registro-existente.ignorar=Si no has sido tú, o lo has sido y recuerdas tu contraseña, puedes ignorar este email.

email.cuenta-bloqueada.asunto=Tu cuenta se ha bloqueado temporalmente
email.cuenta-bloqueada.cuerpo=Ha habido varios intentos fallidos de iniciar sesión con tu cuenta, así que queda bloqueada durante {0} minutos.
email.cuenta-bloqueada.recuperar=Si no has sido tú o no recuerdas tu contraseña, puedes cambiarla desde este enlace; al hacerlo, el bloqueo se levanta:

email.contrasena-cambiada.asunto=Tu contraseña se ha cambiado
email.contrasena-cambiada.cuerpo=La contraseña de tu cuenta se cambió el {0} (UTC).
email.contrasena-cambiada.no-fuiste=Si no has sido tú, recupera tu cuenta cuanto antes desde este enlace:

# Política de contraseñas (PoliticaContrasenas). {0}: longitud mínima, {1}: longitud máxima.
contrasena.longitud-minima=La contraseña debe tener al menos {0} caracteres.
contrasena.longitud-maxima=La contraseña no puede tener más de {1} caracteres.
contrasena.prohibida=Esa contraseña es demasiado común; elige otra.
contrasena.datos-personales=La contraseña no puede contener tu nombre ni tu email.
contrasena.mayuscula=La contraseña debe incluir al menos una letra mayúscula.
contrasena.caracter-especial=La contraseña debe incluir al menos un carácter que no sea letra ni número.
