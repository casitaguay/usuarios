<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: pagina(~{::title}, ~{::main})}">
<head>
    <title th:text="#{cuenta.contrasena.titulo}">Cambiar la contraseña</title>
</head>
<body>
<main id="contenido">
    <h1 th:text="#{cuenta.contrasena.titulo}">Cambiar la contraseña</h1>
    <p th:text="#{cuenta.contrasena.texto}">Al cambiarla se cerrarán tus sesiones abiertas en otros dispositivos.</p>

    <!--/* Sin th:field en las contraseñas: nunca se devuelven al navegador */-->
    <form th:action="@{/cuenta/contrasena}" th:object="${formulario}" method="post" novalidate>
        <div th:replace="~{fragmentos :: resumen-errores}"></div>

        <div class="mb-3">
            <label for="contrasenaActual" class="form-label" th:text="#{campo.contrasena-actual}">Contraseña actual</label>
            <input type="password" id="contrasenaActual" name="contrasenaActual" class="form-control"
                   th:classappend="${#fields.hasErrors('contrasenaActual')} ? 'is-invalid'"
                   autocomplete="current-password" required
                   th:attr="aria-invalid=${#fields.hasErrors('contrasenaActual')} ? 'true', aria-describedby=${#fields.hasErrors('contrasenaActual')} ? 'contrasenaActual-error'">
            <div id="contrasenaActual-error" class="invalid-feedback" th:if="${#fields.hasErrors('contrasenaActual')}"
                 th:errors="*{contrasenaActual}"></div>
        </div>

        <div class="mb-3">
            <label for="contrasena" class="form-label" th:text="#{campo.contrasena-nueva}">Contraseña nueva</label>
            <input type="password" id="contrasena" name="contrasena" class="form-control"
                   th:classappend="${#fields.hasErrors('contrasena')} ? 'is-invalid'"
                   autocomplete="new-password" required
                   th:attr="aria-invalid=${#fields.hasErrors('contrasena')} ? 'true', aria-describedby=${#fields.hasErrors('contrasena')} ? 'contrasena-requisitos contrasena-error' : 'contrasena-requisitos'">
            <div th:replace="~{fragmentos :: requisitos-contrasena}"></div>
            <div id="contrasena-error" class="invalid-feedback" th:if="${#fields.hasErrors('contrasena')}">
                <p class="mb-0" th:each="error : ${#fields.errors('contrasena')}" th:text="${error}">Error</p>
            </div>
        </div>

        <div class="mb-3">
            <label for="confirmacion" class="form-label" th:text="#{campo.confirmacion}">Repite la contraseña nueva</label>
            <input type="password" id="confirmacion" name="confirmacion" class="form-control"
                   th:classappend="${#fields.hasErrors('confirmacion')} ? 'is-invalid'"
                   autocomplete="new-password" required
                   th:attr="aria-invalid=${#fields.hasErrors('confirmacion')} ? 'true', aria-describedby=${#fields.hasErrors('confirmacion')} ? 'confirmacion-error'">
            <div id="confirmacion-error" class="invalid-feedback" th:if="${#fields.hasErrors('confirmacion')}"
                 th:errors="*{confirmacion}"></div>
        </div>

        <button type="submit" class="btn btn-primary" th:text="#{cuenta.contrasena.enviar}">Cambiar la contraseña</button>
        <a th:href="@{/inicio}" class="btn btn-link" th:text="#{cuenta.contrasena.cancelar}">Cancelar</a>
    </form>
</main>
</body>
</html>
