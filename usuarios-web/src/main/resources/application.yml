# Configuración común. Base de datos, SMTP y propiedades obligatorias por variables de entorno
# (contracts/configuracion.md): SPRING_DATASOURCE_*, SPRING_MAIL_*, USUARIOS_URL_PUBLICA,
# USUARIOS_EMAIL_REMITENTE. En local, application-local.yml (excluido de git).
spring:
  application:
    name: usuarios
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  messages:
    basename: messages,usuarios/mensajes

server:
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
