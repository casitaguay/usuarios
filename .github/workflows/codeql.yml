name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  analizar:
    name: Análisis CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v5

      # Si CodeQL dejara de admitir el JDK del proyecto, bajar aquí la versión solo para el análisis (research R19)
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      - name: Compilar
        run: ./mvnw -B -DskipTests package

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
