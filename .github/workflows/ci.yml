name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Compilación y tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: usuarios
          POSTGRES_PASSWORD: usuarios-ci
          POSTGRES_DB: usuarios_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U usuarios"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilar y ejecutar los tests
        run: ./mvnw -B verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/usuarios_test
          SPRING_DATASOURCE_USERNAME: usuarios
          SPRING_DATASOURCE_PASSWORD: usuarios-ci
